apiVersion: v1
kind: Namespace
metadata:
  name: pokehome
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pokehome
  namespace: pokehome
  labels:
    app.kubernetes.io/name: pokehome
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pokehome
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pokehome
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pokehome
          image: localhost/pokehome:manual
          imagePullPolicy: Never
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "6746"
          ports:
            - name: http
              containerPort: 6746
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: pokehome
  namespace: pokehome
  labels:
    app.kubernetes.io/name: pokehome
spec:
  selector:
    app.kubernetes.io/name: pokehome
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pokehome
  namespace: pokehome
  labels:
    app.kubernetes.io/name: pokehome
spec:
  ingressClassName: traefik
  rules:
    - host: start.aureal.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pokehome
                port:
                  number: 80
